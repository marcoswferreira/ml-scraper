[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-automation"
version = "0.1.0"
description = "Web scraper, curador inteligente e worker Telegram para o Hub de Afiliados do Mercado Livre"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.48.0",
    "pydantic>=2.9.0",
    "rookiepy>=0.5.4",
    "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
ml-automation = "ml_automation.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.coverage.run]
source = ["ml_automation"]
branch = false
omit = [
    "src/ml_automation/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
