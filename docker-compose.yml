services:
  ml-automation:
    build: .
    container_name: ml-automation
    restart: unless-stopped
    shm_size: "1gb"
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_API_URL=${TELEGRAM_BOT_API_URL:-http://host.docker.internal:8080}
      - TELEGRAM_BOT_API_KEY=${TELEGRAM_BOT_API_KEY:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.state:/app/.state
      - ./output:/app/output
    command:
      - watch
      - --interval-minutes
      - "${ML_INTERVAL_MINUTES:-15}"
      - --batch-size
      - "${ML_BATCH_SIZE:-5}"
      - --send-delay
      - "${ML_SEND_DELAY:-15}"
      - --cooldown-hours
      - "${ML_COOLDOWN_HOURS:-72}"
      - --headless
